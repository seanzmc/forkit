<!doctype html>
<!--
  One carousel slide, 1080 x 1350 (Instagram 4:5). The slide is chosen by the
  query string, so social/render.sh renders every slide from this one file:
    ?type=hook&img=img/couple.jpg&title=...&sub=...    generated scene + headline
    ?type=app&shot=04-swipe-card&title=...&sub=...     real app screenshot
    ?type=cta&title=...                                 logo + where to get it
  Needs node_modules installed (Poppins) and the Play screenshots.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Poppins; font-weight: 700; src: url(../../node_modules/@expo-google-fonts/poppins/700Bold/Poppins_700Bold.ttf); }
  @font-face { font-family: Poppins; font-weight: 500; src: url(../../node_modules/@expo-google-fonts/poppins/500Medium/Poppins_500Medium.ttf); }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; font-family: Poppins, sans-serif; color: #fff; background: #0F0F0F; }
  em { font-style: normal; color: #FF6B35; }

  .tag { position: absolute; left: 64px; top: 60px; display: flex; align-items: center; gap: 16px; z-index: 2; }
  .tag img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); }
  .tag span { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }

  /* hook */
  .hook .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hook .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(15, 15, 15, 0.55) 0%, transparent 22%, transparent 45%, rgba(15, 15, 15, 0.92) 78%, #0F0F0F 100%); }
  .hook .copy { position: absolute; left: 64px; right: 64px; bottom: 96px; }
  .hook h1 { font-size: 76px; line-height: 1.08; font-weight: 700; letter-spacing: -1.5px; }
  .hook p { margin-top: 20px; font-size: 36px; font-weight: 500; color: #CFCFCF; }
  .hook .swipe { position: absolute; right: 64px; bottom: 40px; font-size: 26px; font-weight: 500; color: #FF6B35; }

  /* app */
  .app { background: radial-gradient(700px 600px at 540px 1000px, rgba(255, 107, 53, 0.30), transparent 70%), #0F0F0F; }
  .app .copy { position: absolute; left: 64px; right: 64px; top: 170px; }
  .app h1 { font-size: 64px; line-height: 1.1; font-weight: 700; letter-spacing: -1px; }
  .app p { margin-top: 16px; font-size: 32px; line-height: 1.4; font-weight: 500; color: #B8B8B8; }
  .app .phone {
    position: absolute; left: 50%; transform: translateX(-50%); top: 470px;
    width: 540px; height: 960px; border-radius: 56px; overflow: hidden;
    border: 10px solid #242424; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  .app .phone img { width: 100%; display: block; }

  /* cta */
  .cta { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
         background: radial-gradient(600px 500px at 540px 600px, rgba(255, 107, 53, 0.30), transparent 70%), #0F0F0F; }
  .cta .logo { width: 260px; height: 260px; border-radius: 60px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  .cta .name { margin-top: 48px; font-size: 96px; font-weight: 700; letter-spacing: -2px; }
  .cta h1 { margin-top: 12px; font-size: 52px; font-weight: 700; color: #FF6B35; }
  .cta p { margin-top: 64px; font-size: 34px; font-weight: 500; color: #B8B8B8; line-height: 1.5; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const type = q.get("type");
  const esc = (s) => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // *word* in a title turns that word orange.
  const fmt = (s) => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const tag = '<div class="tag"><img src="../../assets/images/icon.png"><span>ForkIt</span></div>';
  document.body.className = type;
  if (type === "hook") {
    document.body.innerHTML = `<img class="bg" src="${esc(q.get("img"))}"><div class="shade"></div>${tag}
      <div class="copy"><h1>${fmt(q.get("title"))}</h1>${q.get("sub") ? `<p>${fmt(q.get("sub"))}</p>` : ""}</div>
      <div class="swipe">swipe →</div>`;
  } else if (type === "app") {
    document.body.innerHTML = `${tag}<div class="copy"><h1>${fmt(q.get("title"))}</h1>${q.get("sub") ? `<p>${fmt(q.get("sub"))}</p>` : ""}</div>
      <div class="phone"><img src="../../store/screenshots/play/${esc(q.get("shot"))}.png"></div>`;
  } else {
    document.body.innerHTML = `<img class="logo" src="../../assets/images/icon.png"><div class="name">ForkIt</div>
      <h1>${fmt(q.get("title") || "Swipe right on dinner")}</h1>
      <p>Free on iPhone &amp; Android<br>link in bio</p>`;
  }
</script>
</body>
</html>

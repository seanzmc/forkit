name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsconfig.json includes expo-env.d.ts, which supplies the expo/types
      # reference that types process.env. Expo generates that file and it is
      # gitignored, so a fresh checkout does not have it and typecheck fails
      # with implicit-any errors that never appear locally.
      - name: Generate Expo type declarations
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx expo lint

      - name: Build server
        run: npm run server:build

      - name: Smoke test server
        env:
          PORT: 5055
        run: |
          npm run server:prod &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf -m 2 http://localhost:5055/api/health > /dev/null; then
              echo "Server is up"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Server did not become healthy in time"
              exit 1
            fi
            sleep 1
          done

          curl -sf -m 5 http://localhost:5055/api/health
          echo

          # A session must actually be creatable, not just the process alive
          curl -sf -m 10 -X POST \
            -H "Content-Type: application/json" \
            -d '{"mode":"cook-in"}' \
            http://localhost:5055/api/sessions | grep -q '"code"'
          echo "Session creation OK"

  expo-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Expo config
        run: npx expo config --type public --json > expo-config.json

      - name: Validate release config
        run: |
          node -e '
            const c = require("./expo-config.json");
            const errs = [];
            if (c.ios?.bundleIdentifier !== "com.seandm.forkit") errs.push("ios.bundleIdentifier must be com.seandm.forkit");
            if (c.android?.package !== "com.seandm.forkit") errs.push("android.package must be com.seandm.forkit");
            if (c.ios?.infoPlist?.ITSAppUsesNonExemptEncryption !== false) errs.push("ios.infoPlist.ITSAppUsesNonExemptEncryption must be false");
            if (c.ios?.supportsTablet !== false) errs.push("ios.supportsTablet must be false");
            if (!c.extra?.eas?.projectId) errs.push("extra.eas.projectId missing");
            const joinFilter = (c.android?.intentFilters || []).find(f => f.autoVerify && (f.data || []).some(d => d.scheme === "https" && d.pathPrefix === "/join/"));
            if (!joinFilter) errs.push("android.intentFilters must include an autoVerify https /join/ filter");
            const loc = (c.plugins || []).find(p => Array.isArray(p) && p[0] === "expo-location");
            if (!loc?.[1]?.locationWhenInUsePermission) errs.push("expo-location usage description missing");
            if (errs.length) { console.error(errs.join("\n")); process.exit(1); }
            console.log("Release config OK");
          '

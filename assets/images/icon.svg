<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ForkIt icon</title>
  <desc id="desc">Two crossed orange forks with a warm glow on a dark charcoal background. Editable vector recreation of the original PNG.</desc>
  <defs>
    <radialGradient id="background">
      <stop offset="0" stop-color="#263039"/>
      <stop offset="0.72" stop-color="#192229"/>
      <stop offset="1" stop-color="#121b22"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f08155" stop-opacity="0.32"/>
      <stop offset="0.48" stop-color="#d8613f" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#d8613f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFork" gradientUnits="userSpaceOnUse" x1="222" y1="270" x2="450" y2="692">
      <stop stop-color="#ff793c"/>
      <stop offset="0.5" stop-color="#ff7140"/>
      <stop offset="1" stop-color="#ff603f"/>
    </linearGradient>
    <linearGradient id="leftEdge" gradientUnits="userSpaceOnUse" x1="219" y1="251" x2="470" y2="697">
      <stop stop-color="#ffb37b"/>
      <stop offset="1" stop-color="#ee9573"/>
    </linearGradient>
    <linearGradient id="rightFork" gradientUnits="userSpaceOnUse" x1="536" y1="495" x2="868" y2="354">
      <stop stop-color="#ffb128"/>
      <stop offset="0.4" stop-color="#f57c1d"/>
      <stop offset="0.76" stop-color="#ce3b1b"/>
      <stop offset="1" stop-color="#991c18"/>
    </linearGradient>
    <linearGradient id="handleShade" gradientUnits="userSpaceOnUse" x1="0" y1="570" x2="0" y2="938">
      <stop stop-color="#a82012" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#c54216" stop-opacity="0.6"/>
      <stop offset="0.8" stop-color="#941b16" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5e1b19"/>
    </linearGradient>
    <linearGradient id="rightEdge" gradientUnits="userSpaceOnUse" x1="534" y1="530" x2="869" y2="329">
      <stop stop-color="#ffbd62"/>
      <stop offset="0.48" stop-color="#e98b48"/>
      <stop offset="1" stop-color="#b23d2e"/>
    </linearGradient>
    <linearGradient id="frontHandleEdge" gradientUnits="userSpaceOnUse" x1="0" y1="650" x2="0" y2="915">
      <stop stop-color="#ffbd62"/>
      <stop offset="0.35" stop-color="#e18f47" stop-opacity="0.65"/>
      <stop offset="0.7" stop-color="#b96738" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#975033" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="forkHeadEdge">

    </clipPath>
    <clipPath id="forkHandleEdge">
      <rect y="650" width="1024" height="374"/>
    </clipPath>
    <linearGradient id="rearHandle" gradientUnits="userSpaceOnUse" x1="563" y1="750" x2="660" y2="937">
      <stop stop-color="#e96731"/>
      <stop offset="0.48" stop-color="#a32a1a"/>
      <stop offset="1" stop-color="#571b19"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white"/>
      <stop offset="0.78" stop-color="white"/>
      <stop offset="0.87" stop-color="white" stop-opacity="0.55"/>
      <stop offset="0.93" stop-color="white" stop-opacity="0.08"/>
      <stop offset="0.95" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" gradientUnits="userSpaceOnUse" x1="0" y1="785" x2="0" y2="940">
      <stop stop-color="#141e25" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#141e25" stop-opacity="0.4"/>
      <stop offset="0.8" stop-color="#141e25" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#141e25"/>
    </linearGradient>
    <mask id="handleFade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#fade)"/>
    </mask>
    <path id="frontFork" d="M 746,250
      C 756,238 772,251 761,265
      L 624,454
      C 609,470 644,492 654,477
      L 800,289
      C 810,276 828,285 819,300
      L 700,498
      C 687,516 721,537 733,522
      L 858,328
      C 867,313 884,322 877,338
      L 779,542
      C 754,598 718,629 661,622
      C 632,617 619,622 606,641
      L 260.5,1180 L 154.4,1130
      L 549,611
      C 571,582 567,572 553,543
      C 534,503 551,460 582,425 Z"/>

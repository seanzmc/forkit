  <rect width="1024" height="1024" fill="url(#background)"/>
  <ellipse cx="510" cy="462" rx="462" ry="377" fill="url(#glow)"/>
  <g mask="url(#handleFade)" stroke-width="4.5">
    <path d="M 574,746 L 865.3,1130 L 763,1180 L 527,816 Z" fill="url(#rearHandle)" stroke="#bf6040"/>
    <path d="M 282,251
      C 270,238 252,252 265,267
      L 400,453
      C 415,470 380,492 370,477
      L 224,289
      C 214,276 196,285 205,300
      L 324,498
      C 337,516 306,536 294,522
      L 168,328
      C 159,313 141,325 148,339
      L 246,544
      C 269,597 306,628 365,621
      C 391,617 406,623 420,645
      L 454,700 L 495,643
      L 473,612
      C 452,583 460,570 472,542
      C 491,498 472,457 441,424 Z"
      fill="url(#leftFork)" stroke="url(#leftEdge)"/>
    <use href="#frontFork" fill="url(#rightFork)"/>
    <use href="#frontFork" fill="url(#handleShade)"/>
    <use href="#frontFork" fill="none" stroke="url(#rightEdge)" clip-path="url(#forkHeadEdge)"/>
    <use href="#frontFork" fill="none" stroke="url(#frontHandleEdge)" clip-path="url(#forkHandleEdge)"/>
  </g>
  <rect y="785" width="1024" height="239" fill="url(#bottomFade)"/>
</svg>

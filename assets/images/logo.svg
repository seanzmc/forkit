<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>ForkIt</title>
  <defs>
    <path id="fork" d="M-77,-312a19,19 0 0 1 38,0V-170a10,10 0 0 0 20,0V-312a19,19 0 0 1 38,0V-170a10,10 0 0 0 20,0V-312a19,19 0 0 1 38,0V-140C80,-60 42,0 24,32L32,400Q0,412 -32,400L-24,32C-42,0 -80,-60 -77,-140Z"/>
    <radialGradient id="bg" cx="512" cy="440" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A3029"/>
      <stop offset="0.42" stop-color="#2A2329"/>
      <stop offset="1" stop-color="#141920"/>
    </radialGradient>
    <linearGradient id="coral" x1="0" y1="-330" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A55"/>
      <stop offset="1" stop-color="#FF5E3A"/>
    </linearGradient>
    <linearGradient id="amber" x1="95" y1="-320" x2="-40" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C42C1C"/>
      <stop offset="0.38" stop-color="#F59E24"/>
      <stop offset="0.6" stop-color="#F28A22"/>
      <stop offset="1" stop-color="#D4441E"/>
    </linearGradient>
    <linearGradient id="fadeGrad" x1="0" y1="760" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#fadeGrad)"/>
    </mask>
    <!-- The right fork crosses over the left one; cut a clear gap around it. -->
    <mask id="under" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use xlink:href="#fork" transform="translate(608 606) rotate(36.6) scale(1.13)" fill="#000" stroke="#000" stroke-width="52" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g mask="url(#fade)" stroke="#FFD2B0" stroke-opacity=".35" stroke-width="3" stroke-linejoin="round">
    <g mask="url(#under)">
      <use xlink:href="#fork" transform="translate(416 606) rotate(-36.6) scale(1.13)" fill="url(#coral)"/>
    </g>
    <use xlink:href="#fork" transform="translate(608 606) rotate(36.6) scale(1.13)" fill="url(#amber)"/>
  </g>
</svg>

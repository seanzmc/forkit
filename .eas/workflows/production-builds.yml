# Keeps the iOS and Android binaries on the latest main's native code. Runs
# on every push to main (needs the GitHub repo linked to the EAS project:
# expo.dev → forkit → Project settings → GitHub). Its partner,
# production-updates.yml, ships the JS.
#
# Per platform: if no production build exists for the current native
# fingerprint (new native dependency, Expo SDK bump, app.json/app.config.js
# change, ...), build one and ship it: iOS to TestFlight (add it to the
# external "Friends" group by hand in App Store Connect), Android to the Play
# closed track ("alpha", where the
# forkit-testers Google Group gets it), rolled out (releaseStatus in
# eas.json). Each closed release goes through Google review first. Otherwise do nothing.
#
# Runs are never cancelled, so a newer push can't kill a build or submit
# halfway; that is why this is separate from the updates workflow, which is
# cancelled. See "Keeping every part current" in CLAUDE.md.
name: Production builds

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      # A build started by the previous push may still be running; wait for it
      # instead of starting a duplicate.
      wait_for_in_progress: true

  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android to Play (closed track)
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  # A submit job, not testflight: a testflight job given an EAS build_id needs
  # a paid EAS plan, and on the free plan it fails before uploading (build 9,
  # 2026-11-06), which also skipped submit_android. submit only reaches
  # internal TestFlight groups, so add each new build to Friends (the public
  # TestFlight link, an external group) by hand in App Store Connect →
  # TestFlight → Friends → Builds.
  submit_ios:
    name: Submit iOS to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

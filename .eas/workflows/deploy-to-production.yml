# Keeps the iOS and Android apps on the latest main, the way Railway keeps the
# server on it. Runs on every push to main (needs the GitHub repo linked to the
# EAS project: expo.dev → forkit → Project settings → GitHub).
#
# Per platform: if a production build already exists for the current native
# fingerprint, the new JS ships as an over-the-air update to that build's
# "production" channel. If the native side changed (new native dependency,
# Expo SDK bump, app.json/app.config.js change, ...), no build matches, so it
# builds and submits a new binary instead: iOS to TestFlight, Android to the
# Play internal track as a draft. See "Keeping every part current" in
# CLAUDE.md.
name: Deploy to production

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      # A build started by the previous push may still be running; wait for it
      # instead of starting a duplicate.
      wait_for_in_progress: true

  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android to Play (internal, draft)
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  submit_ios:
    name: Submit iOS to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  update_android:
    name: Publish Android update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: production
    # getApiUrl() throws without this, so an update missing it would break
    # every installed app. Builds get the same value from eas.json.
    env:
      EXPO_PUBLIC_DOMAIN: forkit-server-production.up.railway.app
    params:
      channel: production
      platform: android

  update_ios:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    env:
      EXPO_PUBLIC_DOMAIN: forkit-server-production.up.railway.app
    params:
      channel: production
      platform: ios
